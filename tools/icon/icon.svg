<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2466"/>
      <stop offset="0.38" stop-color="#8e3b7c"/>
      <stop offset="0.68" stop-color="#ff6a5a"/>
      <stop offset="1" stop-color="#ffb84d"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19a6b3"/>
      <stop offset="1" stop-color="#0a3558"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.7" stop-color="#ffd25e"/>
      <stop offset="1" stop-color="#ffb347"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a4a"/>
      <stop offset="0.55" stop-color="#e8262f"/>
      <stop offset="1" stop-color="#a5121f"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eef0f4"/>
      <stop offset="1" stop-color="#b9c0cc"/>
    </linearGradient>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="104"/></clipPath>
    <clipPath id="above"><rect x="0" y="0" width="512" height="318"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- sky and sun -->
    <rect x="0" y="0" width="512" height="320" fill="url(#sky)"/>
    <circle cx="300" cy="292" r="92" fill="url(#sun)"/>
    <!-- sun stripes (retro) -->
    <g fill="#ff7a55" opacity="0.85">
      <rect x="200" y="262" width="200" height="7"/>
      <rect x="200" y="278" width="200" height="9"/>
      <rect x="200" y="296" width="200" height="11"/>
    </g>

    <!-- skyline -->
    <g fill="#1c1640">
      <rect x="20"  y="214" width="44" height="110"/>
      <rect x="30"  y="196" width="22" height="20"/>
      <rect x="64"  y="168" width="52" height="156"/>
      <rect x="86"  y="140" width="8"  height="30"/>
      <rect x="116" y="238" width="40" height="86"/>
      <rect x="156" y="196" width="36" height="128"/>
      <polygon points="156,196 174,176 192,196"/>
      <rect x="392" y="226" width="46" height="98"/>
      <rect x="438" y="186" width="56" height="138"/>
      <rect x="456" y="164" width="6"  height="24"/>
    </g>
    <!-- lit windows -->
    <g fill="#ffd36b">
      <rect x="74" y="184" width="8" height="10"/><rect x="96" y="184" width="8" height="10"/>
      <rect x="74" y="210" width="8" height="10"/><rect x="96" y="236" width="8" height="10"/>
      <rect x="74" y="262" width="8" height="10"/><rect x="164" y="214" width="7" height="9"/>
      <rect x="178" y="238" width="7" height="9"/><rect x="30" y="232" width="7" height="9"/>
      <rect x="448" y="204" width="8" height="10"/><rect x="472" y="204" width="8" height="10"/>
      <rect x="448" y="256" width="8" height="10"/><rect x="472" y="230" width="8" height="10"/>
      <rect x="404" y="244" width="7" height="9"/>
    </g>
    <!-- palm tree -->
    <g fill="#1c1640">
      <path d="M352 322 C356 280 364 248 378 214 L386 217 C373 250 366 282 364 322 Z"/>
      <path d="M381 214 C350 196 322 200 304 220 C330 206 356 210 381 218 Z"/>
      <path d="M381 214 C362 178 334 172 314 178 C342 182 362 196 380 220 Z"/>
      <path d="M381 214 C392 180 416 168 440 172 C418 180 400 196 384 220 Z"/>
      <path d="M381 214 C414 198 444 206 458 228 C436 214 410 212 382 220 Z"/>
      <path d="M381 214 C382 186 372 166 356 156 C366 172 372 192 379 218 Z"/>
    </g>

    <!-- water -->
    <rect x="0" y="318" width="512" height="200" fill="url(#water)"/>
    <!-- sun reflection -->
    <g fill="#ffd25e">
      <rect x="236" y="330" width="128" height="6" rx="3" opacity="0.9"/>
      <rect x="252" y="348" width="96"  height="5" rx="2.5" opacity="0.75"/>
      <rect x="268" y="364" width="64"  height="5" rx="2.5" opacity="0.6"/>
      <rect x="282" y="380" width="36"  height="4" rx="2" opacity="0.45"/>
    </g>
    <!-- horizon glint -->
    <rect x="0" y="316" width="512" height="4" fill="#ffe08a" opacity="0.7"/>
  </g>

  <!-- fishing line from top-left -->
  <path d="M60 22 C 120 150, 190 230, 226 262" fill="none" stroke="#f4f1e6" stroke-width="5" stroke-linecap="round" opacity="0.95"/>

  <!-- ripples around bobber -->
  <g fill="none" stroke="#bff3ff" stroke-linecap="round">
    <ellipse cx="226" cy="392" rx="132" ry="30" stroke-width="7" opacity="0.35"/>
    <ellipse cx="226" cy="388" rx="96" ry="21" stroke-width="8" opacity="0.6"/>
  </g>

  <!-- bobber -->
  <g>
    <!-- antenna -->
    <rect x="219" y="254" width="14" height="44" rx="7" fill="#f4f1e6"/>
    <rect x="219" y="254" width="14" height="14" rx="7" fill="#e8262f"/>
    <!-- top (red) half -->
    <path d="M150 360 A76 76 0 0 1 302 360 Z" fill="url(#red)"/>
    <!-- bottom (white) half, cut by waterline -->
    <path d="M150 360 L302 360 A76 76 0 0 1 296 388 L156 388 A76 76 0 0 1 150 360 Z" fill="url(#white)"/>
    <!-- seam -->
    <path d="M151 360 L301 360" stroke="#7d0d18" stroke-width="3" opacity="0.6"/>
    <!-- shine -->
    <ellipse cx="196" cy="318" rx="20" ry="11" transform="rotate(-35 196 318)" fill="#ffffff" opacity="0.7"/>
    <!-- waterline (water in front of bobber) -->
    <path d="M140 388 Q 226 378 312 388 L 312 396 Q 226 404 140 396 Z" fill="#1aa3b5" opacity="0.95"/>
    <path d="M150 389 Q 226 380 302 389" fill="none" stroke="#e6fbff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- jumping fish -->
  <g transform="translate(392 410) rotate(-28)">
    <path d="M-52 0 C -30 -26, 28 -26, 48 -2 C 28 22, -30 24, -52 0 Z" fill="#c8d8e4"/>
    <path d="M-52 0 C -30 -26, 28 -26, 48 -2 C 30 -6, -20 -6, -52 0 Z" fill="#6f8ea6"/>
    <path d="M44 -2 L 74 -24 L 68 -2 L 76 20 Z" fill="#6f8ea6"/>
    <circle cx="-32" cy="-5" r="5" fill="#1c1640"/>
    <circle cx="-33" cy="-6" r="1.8" fill="#ffffff"/>
  </g>
  <g fill="#e6fbff">
    <circle cx="452" cy="452" r="7"/><circle cx="470" cy="436" r="5"/><circle cx="436" cy="470" r="5"/>
  </g>

  <!-- tile edge -->
  <rect x="18" y="18" width="476" height="476" rx="102" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#120e2c" stroke-width="6"/>
</svg>
